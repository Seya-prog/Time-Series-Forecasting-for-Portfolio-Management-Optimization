[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=57

filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
    ignore::RuntimeWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::ResourceWarning
    ignore:.*force_all_finite.*was renamed to.*ensure_all_finite.*:FutureWarning
    ignore:.*force_all_finite.*:FutureWarning
    ignore:.*ensure_all_finite.*:FutureWarning
    ignore:.*No supported index.*:FutureWarning
    ignore:.*No supported index.*:UserWarning
    ignore:.*No supported index.*:ValueWarning
    ignore:.*sklearn.*:FutureWarning
    ignore:.*statsmodels.*:FutureWarning
    ignore:.*tensorflow.*:DeprecationWarning
    ignore:.*matplotlib.*:UserWarning
    ignore:.*matplotlib.*:RuntimeWarning
    ignore:.*matplotlib.*:DeprecationWarning
    ignore:.*pyplot.*:RuntimeWarning
    ignore:.*figure.*:RuntimeWarning
    ignore:.*More than.*figures.*:RuntimeWarning

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
